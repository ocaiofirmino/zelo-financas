name: Formatação e revisão visual dos cartões
on:
  push:
    branches: [preview/cartoes-estilo-prettier-20261028]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            demo/package-lock.json
      - run: npm ci
      - run: npm run format
      - name: Exportar arquivos formatados
        run: node scripts/style-preview-format.mjs
      - run: npm run format:check
      - run: npm run lint
      - run: npx tsc --noEmit --incremental false
      - name: Regras e APIs
        run: |
          npm run test:finance
          npm run test:export
          npm run test:savings
          npm run test:profile
          npm run test:profile-api
          npm run test:cards
          npm run test:cards-api
          npm run test:access
      - run: npm ci --prefix demo
      - run: npm run build --prefix demo
      - name: Conferir contraste e capturar desktop e celular
        run: |
          npm run preview --prefix demo -- --host 127.0.0.1 --port 4173 >/tmp/zelo-style-preview.log 2>&1 &
          ZELO_SERVER_PID=$!
          google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-port=9222 --user-data-dir=/tmp/zelo-style-browser >/tmp/zelo-style-chrome.log 2>&1 &
          ZELO_BROWSER_PID=$!
          trap 'kill "$ZELO_SERVER_PID" "$ZELO_BROWSER_PID" 2>/dev/null || true' EXIT
          node scripts/style-preview-browser.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: zelo-cartoes-corrigidos
          path: /tmp/zelo-multicartoes-*.png
          retention-days: 1
